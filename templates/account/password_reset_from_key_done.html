{% extends "base.jinja" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-amber-50 to-white flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-amber-100 p-8 transform hover:scale-105 transition-all duration-300">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center">
                <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>
        
        <h2 class="text-3xl font-bold text-gray-800 mb-4 text-center">Şifre Başarıyla Değiştirildi!</h2>
        
        <p class="text-gray-600 mb-8 text-center leading-relaxed">
            Artık yeni şifrenizle giriş yapabilirsiniz. Hesabınıza güvenli bir şekilde erişebilirsiniz.
        </p>

        <div class="space-y-4">
            <a href="{% url 'giris_yap' %}" 
               class="w-full bg-amber-600 text-white py-3 px-6 rounded-xl hover:bg-amber-700 transition-all duration-300 font-semibold shadow-md hover:shadow-lg flex items-center justify-center group">
                <span>Giriş Yap</span>
                <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </a>
            
            <a href="/" 
               class="w-full border border-gray-300 text-gray-700 py-3 px-6 rounded-xl hover:border-amber-300 hover:text-amber-700 transition-all duration-300 font-medium flex items-center justify-center group">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-500 text-center">
                Güvenliğiniz için şifrenizi kimseyle paylaşmayın.
            </p>
        </div>
    </div>
</div>
{% endblock %}
